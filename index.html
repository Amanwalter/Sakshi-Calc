<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit IV API Calculator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .no-print { @media print { display: none; } }
        .print-only { display: none; @media print { display: block; } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Icons ---
        const IconFlask = ({ className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>
            </svg>
        );

        const IconUpload = ({ className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/>
            </svg>
        );

        const IconSearch = ({ className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
            </svg>
        );

        const IconTablets = ({ className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="7" cy="7" r="5"/><circle cx="17" cy="17" r="5"/><path d="M12 17h10"/><path d="m3.46 10.54 7.08-7.08"/>
            </svg>
        );

        const IconPrinter = ({ className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>
            </svg>
        );
        
        const IconLink = ({ className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
        );

        // --- Helper Functions ---

        const parseCSV = (text) => {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length === 0) return [];

            const splitCSVLine = (row) => {
                const matches = [];
                let insideQuotes = false;
                let currentWord = '';
                
                for (let i = 0; i < row.length; i++) {
                    let char = row[i];
                    let nextChar = row[i + 1] || '';

                    if (char === '"') {
                        if (insideQuotes && nextChar === '"') {
                            currentWord += '"';
                            i++; 
                        } else {
                            insideQuotes = !insideQuotes;
                        }
                    } else if (char === ',' && !insideQuotes) {
                        matches.push(currentWord.trim());
                        currentWord = '';
                    } else {
                        currentWord += char;
                    }
                }
                matches.push(currentWord.trim());
                return matches;
            };

            const rawHeaders = splitCSVLine(lines[0]).map(h => h.toLowerCase());
            
            const catIdx = rawHeaders.findIndex(h => h.includes('category'));
            const formIdx = rawHeaders.findIndex(h => h.includes('form'));
            const nameIdx = rawHeaders.findIndex(h => h.includes('generic name') || h.includes('generic'));
            const idIdx = rawHeaders.findIndex(h => h.includes('s no') || h.includes('id'));

            const results = [];
            
            for (let i = 1; i < lines.length; i++) {
                const currentLine = lines[i];
                if (!currentLine) continue;
                
                const data = splitCSVLine(currentLine);
                
                results.push({
                    's no': idIdx !== -1 ? data[idIdx] : '-',
                    'category': catIdx !== -1 ? data[catIdx] : '',
                    'form': formIdx !== -1 ? data[formIdx] : '',
                    'generic name': nameIdx !== -1 ? data[nameIdx] : ''
                });
            }
            
            return results;
        };

        const parseIngredients = (compositionStr) => {
            if (!compositionStr) return [];
            const parts = compositionStr.split(/,(?![^(]*\))/).map(s => s.trim());
            
            return parts.map((part, index) => {
                const match = part.match(/(.*?)\s+(\d+(?:\.\d+)?)\s*(mg|mcg|gm|g|iu|%|ml)/i);
                if (match) {
                    return {
                        id: index,
                        name: match[1].trim(),
                        strength: parseFloat(match[2]),
                        unit: match[3].toLowerCase(),
                        original: part
                    };
                } else {
                    return {
                        id: index,
                        name: part,
                        strength: 0,
                        unit: '-',
                        original: part
                    };
                }
            });
        };

        const convertToDisplayUnit = (amountInMg) => {
            if (amountInMg >= 1000000) return { val: (amountInMg / 1000000).toFixed(3), unit: 'kg' }; 
            if (amountInMg >= 1000) return { val: (amountInMg / 1000).toFixed(3), unit: 'g' };
            return { val: amountInMg.toFixed(2), unit: 'mg' };
        };

        const normalizeToMg = (val, unit) => {
            if (unit === 'g' || unit === 'gm') return val * 1000;
            if (unit === 'mcg') return val / 1000;
            if (unit === 'kg') return val * 1000000;
            return val; 
        };

        // --- Main Component ---

        const App = () => {
            // States
            const [rawData, setRawData] = useState([]);
            const [filteredData, setFilteredData] = useState([]);
            const [selectedDrug, setSelectedDrug] = useState(null);
            const [batchSize, setBatchSize] = useState(100000); 
            const [mwaFactors, setMwaFactors] = useState({}); 
            const [searchTerm, setSearchTerm] = useState("");
            const [parsedIngredients, setParsedIngredients] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState(""); 
            const [selectedForm, setSelectedForm] = useState(""); 
            
            const [sheetUrl, setSheetUrl] = useState("https://docs.google.com/spreadsheets/d/1sw86guXqSdTAFapE7dDf2NvvbdeFIiLdjpuBnkl4YKw/edit?usp=sharing");
            const [isLoading, setIsLoading] = useState(false);
            const [lastSync, setLastSync] = useState(null);

            // Fetch Data Function (Supports foreground clicks and background silent syncs)
            const fetchDataFromUrl = async (urlToFetch, isBackground = false) => {
                if (!urlToFetch || !urlToFetch.trim()) return;
                
                const idMatch = urlToFetch.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if (!idMatch) {
                    if (!isBackground) alert("Invalid Google Sheets URL. Please copy the full link from your browser.");
                    return;
                }
                const sheetId = idMatch[1];
                
                const gidMatch = urlToFetch.match(/[#&]gid=([0-9]+)/);
                const gid = gidMatch ? gidMatch[1] : "0";
                
                const exportUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${gid}`;
                
                if (!isBackground) setIsLoading(true);
                
                try {
                    const response = await fetch(exportUrl);
                    if (!response.ok) throw new Error("Network response was not ok");
                    
                    const text = await response.text();
                    
                    if (text.trim().startsWith("<!DOCTYPE html>") || text.trim().startsWith("<html")) {
                        if (!isBackground) alert("ERROR: The Google Sheet is private.\n\nPlease open the sheet, click 'Share' in the top right, and change access to 'Anyone with the link can view'.");
                        if (!isBackground) setIsLoading(false);
                        return;
                    }
                    
                    const parsed = parseCSV(text);
                    if (parsed && parsed.length > 0) {
                        setRawData(parsed);
                        
                        // Save permanently to the browser
                        localStorage.setItem('apiCalcData', JSON.stringify(parsed));
                        localStorage.setItem('apiCalcSheetUrl', urlToFetch);
                        
                        const timeString = new Date().toLocaleTimeString();
                        setLastSync(timeString);
                        localStorage.setItem('apiCalcLastSync', timeString);
                        
                        setSheetUrl(urlToFetch);
                    }
                    
                    if (!isBackground) {
                        resetFilters();
                        alert("Google Sheet linked and synced successfully!");
                    }
                } catch (error) {
                    console.error("Fetch error:", error);
                    if (!isBackground) alert("Failed to fetch the sheet. Please make sure the link is correct and the sheet is public.");
                } finally {
                    if (!isBackground) setIsLoading(false);
                }
            };

            // 1. ON INITIAL PAGE LOAD (or refresh) -> Safely load saved data & instantly check for updates
            useEffect(() => {
                const savedUrl = localStorage.getItem('apiCalcSheetUrl');
                const savedData = localStorage.getItem('apiCalcData');
                const savedSync = localStorage.getItem('apiCalcLastSync');
                
                // Use saved URL or default to the embedded Google Sheet
                const urlToUse = savedUrl || "https://docs.google.com/spreadsheets/d/1sw86guXqSdTAFapE7dDf2NvvbdeFIiLdjpuBnkl4YKw/edit?usp=sharing";
                setSheetUrl(urlToUse);
                if (savedSync) setLastSync(savedSync);
                
                if (savedData) {
                    try {
                        setRawData(JSON.parse(savedData));
                    } catch (e) {
                        console.error("Failed to parse saved data");
                    }
                }

                // Automatically fetch data on app startup
                fetchDataFromUrl(urlToUse, true);

                // If a URL was saved, silently grab the newest version in the background immediately
                if (savedUrl) {
                    fetchDataFromUrl(savedUrl, true);
                }
            }, []);

            // 2. LIVE AUTO-SYNC -> Triggers silently every time you switch back to this browser tab!
            useEffect(() => {
                const handleFocus = () => {
                    const savedUrl = localStorage.getItem('apiCalcSheetUrl');
                    if (savedUrl) {
                        fetchDataFromUrl(savedUrl, true); // true = silent background refresh
                    }
                };
                
                window.addEventListener('focus', handleFocus);
                return () => window.removeEventListener('focus', handleFocus);
            }, []);

            // 3. AUTOMATIC HOURLY SYNC -> Fetches data every hour automatically
            useEffect(() => {
                const interval = setInterval(() => {
                    const savedUrl = localStorage.getItem('apiCalcSheetUrl') || sheetUrl;
                    if (savedUrl) {
                        fetchDataFromUrl(savedUrl, true); // true = silent background refresh
                    }
                }, 3600000); // 3600000 ms = 1 hour
                
                return () => clearInterval(interval); // Cleanup on unmount
            }, [sheetUrl]);

            const handleFetchGoogleSheet = () => {
                fetchDataFromUrl(sheetUrl, false); // false = manual click, show loading/alerts
            };

            // Handle manual local CSV Upload (disconnects the live sheet)
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const parsed = parseCSV(text);
                    
                    setRawData(parsed);
                    localStorage.setItem('apiCalcData', JSON.stringify(parsed));
                    
                    // Disconnect the sheet since user provided a hard file
                    setSheetUrl("");
                    setLastSync(null);
                    localStorage.removeItem('apiCalcSheetUrl');
                    localStorage.removeItem('apiCalcLastSync');
                    
                    resetFilters();
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const resetFilters = () => {
                setSearchTerm("");
                setSelectedCategory("");
                setSelectedForm("");
                setSelectedDrug(null);
            };

            const categories = useMemo(() => {
                const cats = [...new Set(rawData.map(item => item.category).filter(Boolean))];
                return cats.sort();
            }, [rawData]);

            const forms = useMemo(() => {
                let data = rawData;
                if (selectedCategory) {
                    data = data.filter(item => (item.category || '').toLowerCase() === selectedCategory.toLowerCase());
                }
                const formsSet = [...new Set(data.map(item => item.form).filter(Boolean))];
                return formsSet.sort();
            }, [rawData, selectedCategory]);

            useEffect(() => {
                if (!rawData.length) {
                    setFilteredData([]);
                    return;
                }
                
                const filtered = rawData.filter(item => {
                    const form = (item.form || '').toLowerCase();
                    const genericName = (item['generic name'] || '').toLowerCase();
                    const category = (item.category || '').toLowerCase();

                    const matchesSearch = genericName.includes(searchTerm.toLowerCase());
                    const matchesCategory = !selectedCategory || category === selectedCategory.toLowerCase();
                    const matchesForm = !selectedForm || form === selectedForm.toLowerCase();
                    
                    return matchesSearch && matchesCategory && matchesForm;
                });
                
                setFilteredData(filtered);
            }, [rawData, searchTerm, selectedCategory, selectedForm]);

            const handleSelectDrug = (drug) => {
                setSelectedDrug(drug);
                const ingredients = parseIngredients(drug['generic name']);
                setParsedIngredients(ingredients);
                
                const initialFactors = {};
                ingredients.forEach(ing => {
                    initialFactors[ing.id] = 1.0;
                });
                setMwaFactors(initialFactors);
            };

            const handleFactorChange = (id, val) => {
                setMwaFactors(prev => ({
                    ...prev,
                    [id]: parseFloat(val) || 0
                }));
            };

            return (
                <div className="min-h-screen pb-12 w-full">
                    {/* Header */}
                    <header className="bg-slate-900 text-white p-4 sm:p-6 shadow-lg no-print w-full">
                        <div className="w-full mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                            
                            {/* --- FIXED LOGO & TITLE SECTION --- */}
                            <div className="flex items-center gap-4 w-full md:w-auto">
                                {/* Logo - Now visible on mobile (h-12) and desktop (h-[85px]) */}
                                <img src="image/logo.jpg" alt="Walter Logo" className="h-12 sm:h-[85px] w-auto object-contain mix-blend-screen" />
                                
                                {/* Text Column */}
                                <div className="flex flex-col">
                                    <h1 className="text-xl sm:text-2xl font-bold tracking-tight flex items-center gap-2">
                                        Unit IV API Calculator
                                    </h1>
                                    <div className="text-slate-400 text-xs sm:text-sm mt-1 flex flex-wrap items-center gap-2 sm:gap-3">
                                        Formulation Batch Planning Tool
                                        {lastSync && (
                                            <span className="bg-teal-900/60 border border-teal-800 text-teal-300 text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1.5 shadow-sm">
                                                <span className="relative flex h-1.5 w-1.5">
                                                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span>
                                                  <span className="relative inline-flex rounded-full h-1.5 w-1.5 bg-teal-500"></span>
                                                </span>
                                                Live Synced: {lastSync}
                                            </span>
                                        )}
                                    </div>
                                </div>
                            </div>
                            
                            {/* URL & Upload Tools */}
                            <div className="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto mt-2 md:mt-0">
                                {/* Google Sheet URL Input */}
                                <div className="flex w-full sm:w-auto bg-slate-800 rounded-lg overflow-hidden border border-slate-700 focus-within:border-teal-400 transition-colors">
                                    <div className="px-3 flex items-center text-slate-400 bg-slate-800">
                                        <IconLink size={16} />
                                    </div>
                                    <input 
                                        type="text" 
                                        value={sheetUrl}
                                        onChange={(e) => setSheetUrl(e.target.value)}
                                        placeholder="Paste public Google Sheet URL" 
                                        className="bg-slate-800 text-sm text-white px-2 py-2.5 w-full sm:w-64 focus:outline-none placeholder-slate-500"
                                    />
                                    <button 
                                        onClick={handleFetchGoogleSheet}
                                        disabled={isLoading || !sheetUrl.trim()}
                                        className={`px-4 py-2.5 text-sm font-medium transition-colors whitespace-nowrap ${
                                            isLoading || !sheetUrl.trim() ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-teal-600 hover:bg-teal-500 text-white'
                                        }`}
                                    >
                                        {isLoading ? 'Loading...' : 'Fetch URL'}
                                    </button>
                                </div>
                                
                                <div className="text-slate-500 font-medium text-xs hidden sm:block">OR</div>

                                {/* Local File Upload */}
                                <label className="flex items-center justify-center w-full sm:w-auto gap-2 bg-slate-700 hover:bg-slate-600 px-4 py-2.5 rounded-lg cursor-pointer transition text-sm font-medium border border-slate-600 whitespace-nowrap">
                                    <IconUpload size={16} />
                                    Upload CSV
                                    <input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" />
                                </label>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="w-full p-4 md:p-6 space-y-6">
                        
                        {/* Filters Section */}
                        <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 no-print">
                            <h2 className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4">Filters</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-2">Category</label>
                                    <select
                                        value={selectedCategory}
                                        onChange={(e) => {
                                            setSelectedCategory(e.target.value);
                                            setSelectedForm(""); 
                                            setSelectedDrug(null); 
                                        }}
                                        className="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent"
                                    >
                                        <option value="">All Categories</option>
                                        {categories.map((cat, idx) => (
                                            <option key={idx} value={cat}>{cat}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-2">Form</label>
                                    <select
                                        value={selectedForm}
                                        onChange={(e) => {
                                            setSelectedForm(e.target.value);
                                            setSelectedDrug(null); 
                                        }}
                                        className="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent"
                                    >
                                        <option value="">All Forms</option>
                                        {forms.map((form, idx) => (
                                            <option key={idx} value={form}>{form}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                        </section>

                        {/* Search & Selection Section */}
                        <section className="grid grid-cols-1 lg:grid-cols-3 gap-6 no-print">
                            {/* Left Panel: Search & List */}
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 h-[500px] flex flex-col">
                                <h2 className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3 flex justify-between items-center">
                                    Select Formulation
                                </h2>
                                <div className="relative mb-4">
                                    <div className="absolute left-3 top-2.5 text-slate-400">
                                        <IconSearch size={18} />
                                    </div>
                                    <input
                                        type="text"
                                        placeholder="Search Generic Name..."
                                        className="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                                    {filteredData.length === 0 ? (
                                        <div className="text-center py-10 text-slate-400 text-sm flex flex-col items-center gap-2">
                                            <IconTablets size={32} className="opacity-20 mb-2" />
                                            No formulations found. <br/>Paste a Google Sheet URL above to get started.
                                        </div>
                                    ) : (
                                        filteredData.map((drug, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleSelectDrug(drug)}
                                                className={`w-full text-left p-3 rounded-lg text-sm border transition-all ${
                                                    selectedDrug === drug
                                                    ? 'bg-teal-50 border-teal-500 ring-1 ring-teal-500'
                                                    : 'bg-white border-slate-100 hover:bg-slate-50 hover:border-slate-300'
                                                }`}
                                            >
                                                <div className="font-medium text-slate-900 line-clamp-2">{drug['generic name']}</div>
                                                <div className="flex items-center gap-2 mt-2">
                                                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wide ${
                                                        (drug.form || '').toLowerCase().includes('tablet') || (drug.form || '').toLowerCase().includes('bolus') || (drug.form || '').toLowerCase().includes('capsule')
                                                        ? 'bg-purple-100 text-purple-700'
                                                        : 'bg-orange-100 text-orange-700'
                                                    }`}>
                                                        {drug.form || 'Unknown'}
                                                    </span>
                                                    {drug['s no'] && drug['s no'] !== '-' && (
                                                        <span className="text-xs text-slate-400">ID: {drug['s no']}</span>
                                                    )}
                                                </div>
                                            </button>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* Right Panel: Calculator Input */}
                            <div className="lg:col-span-2 space-y-6">
                                {!selectedDrug ? (
                                    <div className="h-full flex flex-col items-center justify-center bg-slate-50 rounded-xl border-2 border-dashed border-slate-200 text-slate-400">
                                        <div className="mb-4 opacity-50">
                                            <IconTablets size={48} />
                                        </div>
                                        <p>Select a formulation from the list to begin calculation</p>
                                    </div>
                                ) : (
                                    <>
                                        {/* Batch Settings */}
                                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b border-slate-100 pb-4">
                                                <div>
                                                    <h2 className="text-xl font-bold text-slate-800">Batch Configuration</h2>
                                                    <p className="text-slate-500 text-sm">{selectedDrug['generic name']}</p>
                                                </div>
                                                <div className="mt-4 md:mt-0">
                                                    <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Target Batch Size (Units)</label>
                                                    <input
                                                        type="number"
                                                        value={batchSize}
                                                        onChange={(e) => setBatchSize(Number(e.target.value))}
                                                        className="block w-48 text-right font-mono text-lg font-bold text-teal-700 bg-teal-50 border-teal-200 rounded-md p-2 focus:ring-2 focus:ring-teal-500 focus:outline-none"
                                                    />
                                                </div>
                                            </div>

                                            {/* Ingredients Grid */}
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-sm">
                                                    <thead>
                                                        <tr className="bg-slate-50 border-b border-slate-200">
                                                            <th className="py-3 px-4 font-semibold text-slate-600">Ingredient (Salt)</th>
                                                            <th className="py-3 px-4 font-semibold text-slate-600">Label Claim</th>
                                                            <th className="py-3 px-4 font-semibold text-slate-600 w-40">
                                                                MWA Factor
                                                                <span className="block text-[10px] font-normal text-slate-400">1.0 = Standard, 1.1 = +10%</span>
                                                            </th>
                                                            <th className="py-3 px-4 font-semibold text-slate-600 text-right">Raw Material Required</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {parsedIngredients.map((ing) => {
                                                            const factor = mwaFactors[ing.id] || 1;
                                                            const strengthMg = normalizeToMg(ing.strength, ing.unit);
                                                            const totalMg = strengthMg * factor * batchSize;
                                                            const display = convertToDisplayUnit(totalMg);

                                                            return (
                                                                <tr key={ing.id} className="hover:bg-slate-50 transition">
                                                                    <td className="py-4 px-4 font-medium text-slate-800">{ing.name}</td>
                                                                    <td className="py-4 px-4 text-slate-600">
                                                                        <span className="bg-slate-100 px-2 py-1 rounded text-xs font-mono">
                                                                            {ing.strength} {ing.unit}
                                                                        </span>
                                                                    </td>
                                                                    <td className="py-4 px-4">
                                                                        <div className="relative">
                                                                            <input
                                                                                type="number"
                                                                                step="0.01"
                                                                                value={mwaFactors[ing.id] || ''}
                                                                                onChange={(e) => handleFactorChange(ing.id, e.target.value)}
                                                                                className="w-24 pl-3 pr-2 py-1.5 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none text-center font-mono text-blue-700 font-bold"
                                                                            />
                                                                            <span className="ml-2 text-xs text-slate-400">x</span>
                                                                        </div>
                                                                    </td>
                                                                    <td className="py-4 px-4 text-right">
                                                                        <span className="text-lg font-bold text-slate-900">{display.val}</span>
                                                                        <span className="ml-1 text-sm text-slate-500 font-medium">{display.unit}</span>
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        {/* Actions */}
                                        <div className="flex justify-end gap-3 no-print">
                                            <button
                                                onClick={() => window.print()}
                                                className="flex items-center gap-2 px-6 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition shadow-sm"
                                            >
                                                <IconPrinter size={18} />
                                                Print Batch Sheet
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </section>
                    </main>

                    {/* Print Only Layout */}
                    <div className="print-only p-8 bg-white">
                        <div className="border-b-2 border-slate-800 pb-4 mb-6 flex justify-between items-end">
                            <div>
                                <h1 className="text-3xl font-bold text-slate-900">Manufacturing Batch Sheet</h1>
                                <p className="text-slate-500 mt-1">Generated by Unit IV API Calculator</p>
                            </div>
                            <div className="text-right">
                                <p className="text-sm text-slate-500">Date: {new Date().toLocaleDateString()}</p>
                            </div>
                        </div>

                        {selectedDrug && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-2 gap-8 bg-slate-50 p-6 rounded-lg border border-slate-200">
                                    <div>
                                        <p className="text-xs uppercase font-bold text-slate-500">Product Name</p>
                                        <p className="text-xl font-bold text-slate-900">{selectedDrug['generic name']}</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-xs uppercase font-bold text-slate-500">Batch Size</p>
                                        <p className="text-xl font-bold text-slate-900">{batchSize.toLocaleString()} <span className="text-sm font-normal text-slate-500">units</span></p>
                                    </div>
                                </div>

                                <table className="w-full border-collapse border border-slate-300">
                                    <thead>
                                        <tr className="bg-slate-100">
                                            <th className="border border-slate-300 p-3 text-left">Ingredient</th>
                                            <th className="border border-slate-300 p-3 text-center">Label Claim</th>
                                            <th className="border border-slate-300 p-3 text-center">Factor Used</th>
                                            <th className="border border-slate-300 p-3 text-right">Required Quantity</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {parsedIngredients.map((ing) => {
                                            const factor = mwaFactors[ing.id] || 1;
                                            const strengthMg = normalizeToMg(ing.strength, ing.unit);
                                            const totalMg = strengthMg * factor * batchSize;
                                            const display = convertToDisplayUnit(totalMg);
                                            
                                            return (
                                                <tr key={ing.id}>
                                                    <td className="border border-slate-300 p-3 font-medium">{ing.name}</td>
                                                    <td className="border border-slate-300 p-3 text-center">{ing.strength} {ing.unit}</td>
                                                    <td className="border border-slate-300 p-3 text-center text-slate-600">{factor}</td>
                                                    <td className="border border-slate-300 p-3 text-right font-bold">{display.val} {display.unit}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>

                                <div className="mt-12 border-t border-slate-200 pt-8 flex justify-between text-sm text-slate-400">
                                    <div className="pt-8 border-t border-slate-400 w-48 text-center">Calculated By</div>
                                    <div className="pt-8 border-t border-slate-400 w-48 text-center">Verified By</div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
